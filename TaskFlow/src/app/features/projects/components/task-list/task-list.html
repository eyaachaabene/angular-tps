@if (tasks().length === 0) {
  <p class="rounded-md bg-slate-50 px-3 py-4 text-sm text-slate-500">Aucune tâche.</p>
} @else {
  <ul class="space-y-3">
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="assigneeNameOf(task)"
        [projectId]="projectId()"
        [editable]="editable()"
        (taskStatusChange)="taskStatusChange.emit($event)"
        (taskDelete)="taskDelete.emit($event)" />
    }
  </ul>
}
