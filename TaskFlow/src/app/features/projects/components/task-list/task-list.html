@if (tasks().length === 0) {
  <p class="rounded-md bg-slate-50 px-3 py-4 text-sm text-slate-500">Aucune tâche.</p>
} @else {
  <ul class="space-y-3">
    @for (task of tasks(); track task.id) {
      <li
        class="rounded-r-md border-l-4 bg-slate-50 px-3 py-3"
        [class.border-l-slate-400]="task.status === 'En attente'"
        [class.border-l-sky-500]="task.status === 'En cours'"
        [class.border-l-emerald-500]="task.status === 'Terminé'"
      >
        <div class="flex flex-wrap items-start justify-between gap-2">
          <div>
            <h4 class="text-sm font-semibold text-slate-800">{{ task.title }}</h4>
            @if (showAssignee()) {
              <p class="mt-1 text-xs text-slate-500">{{ assigneeName()(task) }}</p>
            }
          </div>
          <div class="flex flex-wrap gap-1.5">
            <span
              class="rounded-full px-2 py-1 text-xs font-semibold"
              [class.bg-rose-100]="task.priority === 'Haute'"
              [class.text-rose-800]="task.priority === 'Haute'"
              [class.bg-orange-100]="task.priority === 'Moyenne'"
              [class.text-orange-800]="task.priority === 'Moyenne'"
              [class.bg-emerald-100]="task.priority === 'Basse'"
              [class.text-emerald-800]="task.priority === 'Basse'"
            >{{ task.priority }}</span>
            <span
              class="rounded-full px-2 py-1 text-xs font-medium"
              [class.bg-slate-200]="task.status === 'En attente'"
              [class.text-slate-700]="task.status === 'En attente'"
              [class.bg-sky-100]="task.status === 'En cours'"
              [class.text-sky-800]="task.status === 'En cours'"
              [class.bg-emerald-100]="task.status === 'Terminé'"
              [class.text-emerald-800]="task.status === 'Terminé'"
            >{{ task.status }}</span>
          </div>
        </div>
      </li>
    }
  </ul>
}
