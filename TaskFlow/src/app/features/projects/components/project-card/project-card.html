<article class="flex h-full flex-col rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6">
  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0">
      <h2 class="text-lg font-bold text-slate-900">{{ project().name }}</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ project().description }}</p>
    </div>
    <span
      class="shrink-0 rounded-full px-3 py-1 text-xs font-semibold"
      [class.bg-slate-100]="project().status === 'En attente'"
      [class.text-slate-700]="project().status === 'En attente'"
      [class.bg-sky-100]="project().status === 'En cours'"
      [class.text-sky-800]="project().status === 'En cours'"
      [class.bg-emerald-100]="project().status === 'Terminé'"
      [class.text-emerald-800]="project().status === 'Terminé'"
    >{{ project().status }}</span>
  </div>

  <div class="mt-6 flex-1">
    <h3 class="mb-3 text-xs font-bold uppercase tracking-wider text-slate-500">Tâches</h3>
    <app-task-list [tasks]="project().tasks" />
  </div>

  <button
    class="mt-5 inline-flex min-h-10 items-center justify-center self-start rounded-md bg-emerald-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700"
    type="button"
    (click)="selectProject()"
  >Sélectionner</button>
</article>
